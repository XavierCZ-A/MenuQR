<!doctype html>

<html lang="es">

  <head>

    <title>Página no encontrada (404)</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">

    <!-- Static page: Tailwind isn't available, so the app's design tokens are copied here. -->
    <style>

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: oklch(0.9911 0 0);
        color: oklch(0.1994 0.0470 270.6494);
        display: grid;
        font-family: "Open Sans", ui-sans-serif, system-ui, sans-serif;
        line-height: 1.5;
        min-height: 100dvh;
        padding: 1rem;
        place-items: center;
      }

      main {
        background: oklch(0.9851 0 0);
        border: 1px solid oklch(0.9212 0.0033 17.2170);
        border-radius: 0.5rem;
        display: grid;
        gap: 0.75rem;
        justify-items: center;
        max-width: 28rem;
        padding: 3rem 1.5rem;
        text-align: center;
      }

      .code {
        color: oklch(0.1994 0.0470 270.6494 / 0.4);
        font-size: 3rem;
        font-weight: 800;
        line-height: 1;
      }

      h1 {
        font-size: 1.5rem;
        letter-spacing: -0.025em;
      }

      p {
        color: oklch(0.1994 0.0470 270.6494 / 0.6);
        font-size: 0.875rem;
        text-wrap: pretty;
      }

      a {
        background: oklch(0.5729 0.2337 264.3664);
        border-radius: 0.5rem;
        color: oklch(1 0 0);
        font-size: 0.875rem;
        font-weight: 600;
        margin-top: 0.5rem;
        padding: 0.5rem 1rem;
        text-decoration: none;
      }

    </style>

  </head>

  <body>

    <!-- This file lives in public/404.html -->

    <main>
      <span class="code">404</span>
      <h1>Página no encontrada</h1>
      <p>La página que buscas no existe o cambió de dirección. Revisa que el enlace esté bien escrito.</p>
      <a href="/">Volver al inicio</a>
    </main>

  </body>

</html>
